name-template: "v$NEXT_PATCH_VERSION"
tag-template: "v$NEXT_PATCH_VERSION"
categories:
  - title: "🚀 Features"
    when:
      labels:
        - "feat"
        - "feature"
  - title: "🐛 Bug Fixes"
    when:
      labels:
        - "fix"
        - "bug"
  - title: "🧰 Maintenance"
    when:
      labels:
        - "chore"
        - "refactor"
        - "perf"
        - "ci"
        - "build"
  - title: "📝 Documentation"
    when:
      labels:
        - "docs"
  - title: "🔒 Security"
    when:
      labels:
        - "security"
        - "vulnerability"
  - title: "🧪 Tests"
    when:
      labels:
        - "test"
  - title: "⬆️ Dependencies"
    when:
      labels:
        - "dependencies"
        - "dependabot"
  - type: "pre-exclude"
    when:
      labels:
        - "skip-changelog"
        - "wip"
        - "do not merge"
  - type: "version-resolver"
    semver-increment: "major"
    when:
      labels:
        - "breaking"
        - "major"
  - type: "version-resolver"
    semver-increment: "minor"
    when:
      labels:
        - "feat"
        - "feature"
  - type: "version-resolver"
    semver-increment: "patch"
    when:
      labels:
        - "fix"
        - "bug"
        - "chore"
        - "refactor"
        - "perf"
        - "ci"
        - "build"
        - "test"
        - "docs"
        - "dependencies"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
no-changes-template: "- No changes"
template: |
  ## What’s Changed

  $CHANGES

  **Full Changelog**: https://github.com/urtokk/puppet_forge_updates/compare/$PREVIOUS_TAG...$NEXT_TAG

autolabeler:
  - label: "feat"
    title:
      - "/^feat/i"
  - label: "fix"
    title:
      - "/^fix/i"
  - label: "chore"
    title:
      - "/^chore/i"
  - label: "docs"
    title:
      - "/^docs/i"
  - label: "refactor"
    title:
      - "/^refactor/i"
  - label: "test"
    title:
      - "/^test/i"
  - label: "ci"
    title:
      - "/^ci/i"
  - label: "build"
    title:
      - "/^build/i"
  - label: "perf"
    title:
      - "/^perf/i"
  - label: "dependencies"
    files:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/dependabot.yml"
      - "deny.toml"
  - label: "docs"
    files:
      - "README.md"
      - "CONTRIBUTING.md"
      - "docs/**"
  - label: "test"
    files:
      - "tests/**"
